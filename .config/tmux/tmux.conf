set-option -g default-shell /usr/bin/fish
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:RGB"
set-option -g focus-events on
set -g history-limit 100000
set -g mode-keys vi
set -g mouse on
# Close gaps in window numbering when a window is killed (0,1,2 stays 0,1).
set -g renumber-windows on
set -g status-position top
set -g status-right "%H:%M"
# Re-render the status bar every second so @claude-active flag changes
# (set/unset by Claude SessionStart/SessionEnd hooks) appear promptly.
set -g status-interval 1
# Status bar and inactive-tab background share the same terminal-palette green.
set -g status-style "fg=black,bg=green"
set -g window-status-style "fg=black,bg=green,bold"
# Tab name comes from a small helper script: repo basename when inside
# ~/Documents/repositories/<repo>/..., otherwise basename of the cwd.
# Suffixed with " ✦" when Claude is active (@claude-active set by SessionStart).
# Yellow background overlay when @claude-pending is set (Stop hook).
set -g window-status-format "#{?@claude-pending,#[fg=black#,bg=yellow#,bold],} #I:#(~/.claude/hooks/tmux-tab-name.sh #{q:pane_current_path})#{?@claude-active, ✦,} "
set -g window-status-current-style "fg=white,bg=#44475a,bold"
set -g window-status-current-format "  #I:#(~/.claude/hooks/tmux-tab-name.sh #{q:pane_current_path})#{?@claude-active, ✦,}  "
set -g window-status-separator ""

# Claude Code finish notification: the Stop hook (~/.claude/hooks/notify-tmux-window.sh)
# sets @claude-pending=1 on the source window when it's not the active one. The
# after-select-window hook below clears the flag when the user switches in.
set-hook -g after-select-window 'set-option -wuq @claude-pending'

# Generic bell highlighting (vim, ssh, error tones, etc.) — same yellow as the
# Claude-pending style so all "attention" signals look identical.
# monitor-activity is intentionally off: it fires on any output, which would
# re-flag tabs as soon as they redraw.
set -g monitor-bell on
set -g monitor-activity off
set -g visual-bell off
set -g visual-activity off
set -g bell-action other
set -g window-status-bell-style "fg=black,bg=yellow,bold"
bind -n M-Left  previous-window
bind -n M-Right next-window
bind-key / copy-mode \; send-key ?
